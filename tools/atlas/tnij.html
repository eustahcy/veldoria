<!doctype html><meta charset="utf-8"><body style="background:#111">
<script>
// Rozcina arkusz z czatu na pojedyncze sprite'y.
// Tlo to szachownica przezroczystosci (jasne szarosci) plus miekkie cienie
// obiektow na niej. Szachownice kasujemy calkiem, a cien zamieniamy z powrotem
// na pol-przezroczysta czern, zeby sprite mial wlasny cien jak w oryginale.
window.SPRITY = null;
const PANELE = [
  { id: 'podloze',    x: 0,    y: 0,   w: 512, h: 519 },
  { id: 'budynki',    x: 512,  y: 0,   w: 512, h: 519 },
  { id: 'dekoracje',  x: 1024, y: 0,   w: 512, h: 519 },
  { id: 'roslinnosc', x: 0,    y: 555, w: 512, h: 424 },
  { id: 'mury',       x: 512,  y: 555, w: 512, h: 424 },
  { id: 'wnetrza',    x: 1024, y: 555, w: 512, h: 424 },
];
const TLO_L = 232;                     // srednia jasnosc szachownicy

(async () => {
  const img = new Image(); img.src = 'arkusz.png'; await img.decode();
  const wynik = [];
  for (const pan of PANELE) {
    const W = pan.w - 4, H = pan.h - 4;
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, pan.x + 2, pan.y + 2, W, H, 0, 0, W, H);
    const dane = ctx.getImageData(0, 0, W, H);
    const d = dane.data;

    const rodzaj = new Uint8Array(W * H);       // 1 = szachownica, 2 = cien na szachownicy
    for (let p = 0; p < W * H; p++) {
      const k = p * 4, r = d[k], g = d[k+1], b = d[k+2];
      const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
      if (mn > 196 && mx - mn < 22) rodzaj[p] = 1;
      else if (mn > 118 && mx - mn < 30) rodzaj[p] = 2;
    }
    // tlem jest tylko to, co siega brzegu panelu
    const bg = new Uint8Array(W * H);
    const stos = [];
    const dodaj = (p) => { if (p >= 0 && p < W*H && !bg[p] && rodzaj[p]) { bg[p] = 1; stos.push(p); } };
    for (let i = 0; i < W; i++) { dodaj(i); dodaj(i + (H-1)*W); }
    for (let j = 0; j < H; j++) { dodaj(j*W); dodaj(j*W + W - 1); }
    while (stos.length) {
      const p = stos.pop(), px = p % W, py = (p / W) | 0;
      if (px > 0) dodaj(p - 1);
      if (px < W-1) dodaj(p + 1);
      if (py > 0) dodaj(p - W);
      if (py < H-1) dodaj(p + W);
    }
    for (let p = 0; p < W*H; p++) {
      if (!bg[p]) continue;
      const k = p * 4;
      if (rodzaj[p] === 1) { d[k+3] = 0; continue; }
      const L = (d[k] * 0.3 + d[k+1] * 0.59 + d[k+2] * 0.11);
      const a = Math.max(0, Math.min(170, Math.round((TLO_L - L) / TLO_L * 255)));
      d[k] = 0; d[k+1] = 0; d[k+2] = 0; d[k+3] = a;
    }
    ctx.putImageData(dane, 0, 0);

    // grupy spojne liczymy po pikselach nieprzezroczystych (cien nie skleja sprite'ow)
    const solid = new Uint8Array(W * H);
    for (let p = 0; p < W*H; p++) if (d[p*4+3] > 200) solid[p] = 1;
    const odw = new Uint8Array(W * H);
    for (let p0 = 0; p0 < W*H; p0++) {
      if (odw[p0] || !solid[p0]) continue;
      let minx = W, maxx = 0, miny = H, maxy = 0;
      const s = [p0]; odw[p0] = 1; let ile = 0;
      while (s.length) {
        const p = s.pop(), px = p % W, py = (p / W) | 0;
        ile++;
        if (px < minx) minx = px; if (px > maxx) maxx = px;
        if (py < miny) miny = py; if (py > maxy) maxy = py;
        for (const q of [px>0?p-1:-1, px<W-1?p+1:-1, py>0?p-W:-1, py<H-1?p+W:-1,
                         (px>0&&py>0)?p-W-1:-1, (px<W-1&&py>0)?p-W+1:-1, (px>0&&py<H-1)?p+W-1:-1, (px<W-1&&py<H-1)?p+W+1:-1]) {
          if (q >= 0 && !odw[q] && solid[q]) { odw[q] = 1; s.push(q); }
        }
      }
      if (ile < 260 || maxx - minx < 9 || maxy - miny < 9) continue;
      const m = 3;                                     // margines na cien
      const x0 = Math.max(0, minx - m), y0 = Math.max(0, miny - m);
      const x1 = Math.min(W - 1, maxx + m), y1 = Math.min(H - 1, maxy + m);
      const w = x1 - x0 + 1, h = y1 - y0 + 1;
      const cc = document.createElement('canvas'); cc.width = w; cc.height = h;
      cc.getContext('2d').drawImage(c, x0, y0, w, h, 0, 0, w, h);
      wynik.push({ panel: pan.id, x: x0, y: y0, w, h, png: cc.toDataURL('image/png') });
    }
  }
  window.SPRITY = wynik;
  document.title = 'gotowe ' + wynik.length;
})();
</script></body>
